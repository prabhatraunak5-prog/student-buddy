<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ff;--surface:#ffffff;--ink:#1b1740;--muted:#625f86;--line:#e4e0fa;--brand:#6c4cf5;--brand-ink:#ffffff;--coral:#ff5d85;--teal:#0fa898;--gold:#f5a300;--ok:#0d7a4f;--okbg:#dcf7ea;--no:#b3263e;--nobg:#ffe3e8;--info:#5a4bb0;--infobg:#ece8ff;--shadow:0 10px 30px rgba(60,40,160,.10);--radius:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c24;--surface:#191636;--ink:#f1efff;--muted:#a9a5d0;--line:#2d2960;--brand:#8b73ff;--brand-ink:#0e0c24;--coral:#ff7b9c;--teal:#2dd4bf;--gold:#ffc23d;--ok:#5ee0a8;--okbg:#103a2c;--no:#ff8da1;--nobg:#401827;--info:#b9adff;--infobg:#272152;--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e0c24;--surface:#191636;--ink:#f1efff;--muted:#a9a5d0;--line:#2d2960;--brand:#8b73ff;--brand-ink:#0e0c24;--coral:#ff7b9c;--teal:#2dd4bf;--gold:#ffc23d;--ok:#5ee0a8;--okbg:#103a2c;--no:#ff8da1;--nobg:#401827;--info:#b9adff;--infobg:#272152;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;font-size:16px}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;line-height:1.12;margin:0 0 .4em;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* loader */
#loader{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#2a1d78,#6c4cf5 60%,#ff5d85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#loader.on{opacity:1;pointer-events:all}
#loader .cap{font-size:64px;animation:flip 1s ease-in-out infinite}
#loader .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px}
#loader .bar{width:min(260px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px}
#loader.on .bar i{animation:fill .95s ease-out forwards}
#loader small{opacity:.85}
@keyframes fill{to{width:100%}}
@keyframes flip{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;text-decoration:none;white-space:nowrap}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--coral));color:#fff;font-size:20px}
nav.main{display:flex;gap:2px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap}
nav.main a:hover{color:var(--ink);background:var(--infobg)}
nav.main a.act{background:var(--brand);color:var(--brand-ink)}
.who{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
@media(max-width:900px){.bar{flex-wrap:wrap;height:auto;padding:10px 0}.nav-wrap{order:3;width:100%}nav.main{margin-left:0}.who{margin-left:auto}}

/* hero */
.hero{padding:44px 0 30px;position:relative;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center}
@media(max-width:900px){.hero .grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(38px,6vw,66px);font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:18px;color:var(--muted);max-width:520px}
.quick{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.quick h3{font-size:18px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.qgrid{grid-template-columns:1fr 1fr}}
.art-hero{border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.art-hero svg{display:block;width:100%;height:auto}
.floaty{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.floaty,#loader .cap{animation:none}}

/* controls */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--brand);color:var(--brand-ink);font-size:14.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{padding:7px 12px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;font-size:14.5px}
.switch input{width:18px;height:18px;accent-color:var(--brand)}

/* sections */
main{min-height:60vh}
.page-h{padding:36px 0 6px}
.page-h h1{font-size:clamp(30px,4.5vw,46px);font-weight:800}
.page-h p{color:var(--muted);max-width:720px;margin:0}
.sec{padding:26px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:20px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.art{position:relative;height:110px;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art span{position:absolute;right:16px;bottom:8px;font-size:54px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.art .tag{position:absolute;left:14px;top:12px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.92);color:#2a1d78;border-radius:99px;padding:3px 11px;right:auto;bottom:auto;filter:none}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta i{font-style:normal;font-size:12.5px;font-weight:600;background:var(--infobg);color:var(--info);border-radius:8px;padding:3px 9px}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:10px;padding:5px 10px}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.no{background:var(--nobg);color:var(--no)}
.pill.q{background:var(--infobg);color:var(--info)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,var(--infobg),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:32px}
.stat span{color:var(--muted);font-size:14px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.feat a{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:transform .2s}
.feat a:hover{transform:translateY(-4px)}
.feat .ic{font-size:34px;display:block;margin-bottom:8px}
.feat h3{font-size:20px}.feat p{margin:0;color:var(--muted);font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.panel h3{font-size:21px}
ul.clean{margin:0;padding-left:20px}ul.clean li{margin:5px 0}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{display:flex;gap:10px;align-items:flex-start;margin:7px 0}
ul.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal);flex:none}
.country-head{display:flex;gap:16px;align-items:center;border-radius:var(--radius);padding:20px;color:#fff;margin-bottom:18px}
.country-head .fl{font-size:62px}
.country-head h2{margin:0;font-size:34px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kv small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.kv b{font-size:15.5px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
summary{font-weight:700;cursor:pointer}
details pre,details div.n{margin:10px 0 0;white-space:pre-wrap;font-family:inherit;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
th{color:var(--muted);font-size:13px}
.scroll-x{overflow-x:auto;max-width:100%}
.timer{font-family:'Bricolage Grotesque',sans-serif;font-size:56px;font-weight:800}
footer{margin-top:50px;border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:14px}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:90;background:rgba(15,10,50,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#modal ol{padding-left:22px}#modal ol li{margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 18px;font-weight:600;opacity:0;transition:.25s;z-index:120;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:13px;color:var(--muted)}
.fade{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
</style>
</head>
<body>
<div id="loader"><div class="cap">🎓</div><div class="nm">Student Buddy</div><div class="bar"><i></i></div><small id="ltxt">Loading your campus…</small></div>

<header class="top"><div class="wrap bar">
  <a class="logo" href="#/home"><b>🎓</b>Student Buddy</a>
  <div class="nav-wrap"><nav class="main" id="nav"></nav></div>
  <button class="who" id="who" onclick="location.hash='#/profile'">Log in</button>
</div></header>

<main id="app" class="wrap"></main>

<footer><div class="wrap">
  <b>Student Buddy</b> · Built for students, by a student-first mindset. Eligibility rules, dates and prices change often. Use this as a first filter and always confirm on the official website before you apply or pay.
</div></footer>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ---------- storage (safe) ---------- */
const mem={};
function sGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let P=sGet('sb_profile',null);
let SAVED=sGet('sb_saved',[]);
let CHECK=sGet('sb_check',{});
const S={evType:'all',evOnly:false,evQ:'',inSec:'all',inLoc:'near',inOnly:false,country:'USA',cFree:'all',pCat:'all',lCat:'free'};

/* ---------- constants ---------- */
const YEARS=[['1','1st year'],['2','2nd year'],['3','3rd year'],['4','4th year'],['5','5th year / PG'],['grad','Graduated']];
const BRANCHES=['CSE','IT','AI/ML','ECE','EEE','Mechanical','Civil','Chemical','Biotech','Commerce / BBA','Science','Arts / Humanities','Other'];
const TECH=['CSE','IT','AI/ML','ECE','EEE'];
const ENG=TECH.concat(['Mechanical','Civil','Chemical','Biotech']);
const REGIONS=['Delhi NCR','Bengaluru','Hyderabad','Mumbai','Pune','Chennai','Kolkata','Ahmedabad','Chandigarh','Jaipur','Other'];
const yl=y=>(YEARS.find(a=>a[0]===y)||[0,y])[1];

/* ---------- art ---------- */
const GRAD={hackathon:['#5b3df0','#b05cf5'],meetup:['#0b8fd6','#15c3a4'],marathon:['#ff5d85','#ffa23d'],sports:['#14a04f','#9bd12d'],fest:['#e8355f','#f5a300'],govt:['#0b6e66','#2a68e0'],private:['#6b45f0','#ec4899'],abroad:['#1d4ed8','#0fa898'],learn:['#7c3aed','#2563eb'],cert:['#0f766e','#65a30d'],perk:['#db2777','#f59e0b']};
function art(emoji,key,i,tag){const g=GRAD[key]||GRAD.hackathon;i=i||1;
return `<div class="art" style="background:linear-gradient(135deg,${g[0]},${g[1]})"><svg viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true"><circle cx="${50+(i*53)%280}" cy="20" r="62" fill="#fff" opacity=".13"/><circle cx="${360-(i*41)%190}" cy="105" r="80" fill="#fff" opacity=".11"/><path d="M0 84 Q90 54 190 82 T400 74 V110 H0Z" fill="#fff" opacity=".16"/><g fill="#fff" opacity=".35"><circle cx="${30+(i*29)%90}" cy="70" r="3"/><circle cx="${120+(i*17)%90}" cy="40" r="2.4"/><circle cx="${250+(i*23)%90}" cy="26" r="3"/></g></svg>${tag?`<span class="tag">${esc(tag)}</span>`:''}<span>${emoji}</span></div>`}

const HERO=`<svg viewBox="0 0 520 440" role="img" aria-label="Illustration of a student with a laptop, a globe, and campus event cards">
<defs><linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a22b8"/><stop offset=".6" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5d85"/></linearGradient>
<linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15c3a4"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<linearGradient id="hg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff9f43"/></linearGradient></defs>
<rect width="520" height="440" fill="url(#hg1)"/>
<circle cx="420" cy="70" r="120" fill="#fff" opacity=".1"/><circle cx="60" cy="400" r="150" fill="#fff" opacity=".08"/>
<g opacity=".5" fill="#fff"><circle cx="60" cy="60" r="3"/><circle cx="130" cy="110" r="2"/><circle cx="470" cy="190" r="3"/><circle cx="300" cy="40" r="2.5"/><circle cx="40" cy="220" r="2"/></g>
<g class="floaty"><circle cx="370" cy="150" r="78" fill="url(#hg2)"/><path d="M300 150h140M370 72c-34 30-34 126 0 156M370 72c34 30 34 126 0 156M312 112h116M312 188h116" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/><circle cx="395" cy="125" r="9" fill="#ffd166"/></g>
<rect x="70" y="236" width="300" height="170" rx="14" fill="#1b1740"/><rect x="82" y="248" width="276" height="140" rx="8" fill="#2c2380"/>
<rect x="96" y="262" width="110" height="10" rx="5" fill="#8b73ff"/><rect x="96" y="282" width="190" height="8" rx="4" fill="#fff" opacity=".5"/><rect x="96" y="300" width="150" height="8" rx="4" fill="#fff" opacity=".35"/>
<rect x="96" y="326" width="76" height="40" rx="9" fill="#12b8a6"/><rect x="180" y="326" width="76" height="40" rx="9" fill="#ff5d85"/><rect x="264" y="326" width="76" height="40" rx="9" fill="#ffb020"/>
<path d="M40 406h360l-24 18H64z" fill="#0e0a33"/>
<g class="floaty" style="animation-delay:-2s"><rect x="300" y="262" width="170" height="64" rx="16" fill="#fff"/><text x="318" y="290" font-size="26">🏆</text><text x="354" y="288" font-size="15" font-weight="700" fill="#1b1740" font-family="sans-serif">Hackathon</text><text x="354" y="308" font-size="13" fill="#625f86" font-family="sans-serif">You are eligible</text></g>
<g class="floaty" style="animation-delay:-3.4s"><rect x="330" y="338" width="170" height="60" rx="16" fill="#fff"/><text x="346" y="376" font-size="26">💼</text><text x="382" y="364" font-size="15" font-weight="700" fill="#1b1740" font-family="sans-serif">Internship</text><text x="382" y="383" font-size="13" fill="#625f86" font-family="sans-serif">Near you</text></g>
<g transform="translate(90 120)"><path d="M0 40L60 12l60 28-60 28z" fill="url(#hg3)"/><path d="M26 56v26c20 14 48 14 68 0V56L60 70z" fill="#ffb020"/><path d="M120 40v34" stroke="#fff" stroke-width="4"/><circle cx="120" cy="78" r="6" fill="#fff"/></g>
</svg>`;

/* ---------- eligibility ---------- */
function brOK(br,b){if(!br||br==='any')return true;if(br==='tech')return TECH.includes(b);if(br==='eng')return ENG.includes(b);return br.includes(b)}
function brLabel(br){return br==='tech'?'CS / IT / ECE / EEE':br==='eng'?'Engineering branches':Array.isArray(br)?br.join(', '):'All branches'}
function check(it){
  if(!P)return {st:'q',why:[]};
  const w=[];
  if(it.minAge&&P.age<it.minAge)w.push('Minimum age is '+it.minAge);
  if(it.maxAge&&P.age>it.maxAge)w.push('Maximum age is '+it.maxAge);
  if(it.gender&&P.gender!==it.gender)w.push('Open to women applicants only');
  if(it.years&&!it.years.includes(P.year))w.push('For '+it.years.map(yl).join(' / '));
  if(!brOK(it.br,P.branch))w.push('For '+brLabel(it.br));
  return {st:w.length?'no':'ok',why:w};
}
function pill(c){
  if(c.st==='q')return `<span class="pill q">Log in to check eligibility</span>`;
  if(c.st==='ok')return `<span class="pill ok">✔ You are eligible</span>`;
  return `<span class="pill no">✖ Not eligible: ${esc(c.why.join('; '))}</span>`;
}

/* ---------- data: events ---------- */
const EV=[
{id:'sih',t:'hackathon',e:'🏆',n:'Smart India Hackathon',o:'Ministry of Education and AICTE',when:'Nationwide. Registration usually opens Aug to Sep, grand finale around Dec',mode:'Hybrid',fee:'Free',minAge:17,years:['1','2','3','4','5'],br:'any',link:'https://www.sih.gov.in',d:"India's biggest government-run hackathon. Solve real problem statements from ministries and industry.",tip:'Teams of 6 need at least one female member and a faculty mentor. Your college must nominate your team first.'},

/* ---------- UI helpers ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function openModal(h){$('mbox').innerHTML=h;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function guide(kind,id){
  const it=(kind==='ev'?EV:IN).find(x=>x.id===id);
  const steps=kind==='ev'?GUIDE[it.t]:it.how;
  openModal(`<h2>${esc(it.n)}</h2><p class="note">How to register / apply</p><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${it.tip?`<p class="pill q">💡 ${esc(it.tip)}</p>`:''}${it.note?`<p class="pill q">ℹ️ ${esc(it.note)}</p>`:''}<div class="acts" style="margin-top:14px"><a class="btn" href="${it.link}" target="_blank" rel="noopener noreferrer">Open official site</a><button class="btn ghost" onclick="closeModal()">Close</button></div><p class="note" style="margin-top:12px">Dates, fees and rules change. Confirm on the official website.</p>`);
}
function toggleSave(id){const i=SAVED.indexOf(id);if(i>-1){SAVED.splice(i,1);toast('Removed from saved')}else{SAVED.push(id);toast('Saved to your profile')}sSet('sb_saved',SAVED);rerender()}
function setS(k,v){S[k]=v;rerender()}

}
function sortElig(arr){const r={ok:0,q:1,no:2};return arr.map(a=>({a,c:check(a)})).sort((x,y)=>r[x.c.st]-r[y.c.st])}

function quick(to){
  const age=+$('qa').value;if(!age||age<13||age>40){toast('Enter a valid age');return}
  P=Object.assign({name:'Guest',email:'',college:'',region:'Delhi NCR',guest:true},P||{},{age,gender:$('qg').value,year:$('qy').value,branch:$('qb').value});
  sSet('sb_profile',P);updateWho();location.hash='#/'+to;
}

function evCard(it,c,i){
  const saved=SAVED.includes(it.id);
  return `<article class="card">${art(it.e,it.t,i,TYPE_LABEL[it.t])}<div class="body"><h3>${esc(it.n)}</h3><p>${esc(it.o)}</p>

  if(S.evOnly&&P)list=list.filter(x=>x.c.st==='ok');
  const okc=P?list.filter(x=>x.c.st==='ok').length:0;
  return `<div class="page-h fade"><h1>Events & competitions</h1><p>Hackathons, meetups, marathons, sports and college fests. Eligible ones are shown first.</p></div>${banner()}
  <div class="chips">${TYPES.map(t=>`<button class="chip${S.evType===t[0]?' on':''}" onclick="setS('evType','${t[0]}')">${t[1]}</button>`).join('')}</div>

}
function inNear(it){
  if(S.inLoc==='any')return true;
  const r=S.inLoc==='near'?(P?P.region:'Delhi NCR'):S.inLoc;
  return it.loc[0]==='all'||it.remote||it.loc.includes(r);
}

function mail(){
  const n=$('em1').value||'[Your name]',c=$('em2').value||'[Company]',r=$('em3').value||'[Role]';
  const college=P&&P.college?P.college:'[Your college]';const br=P?P.branch:'[Branch]';const yr=P?yl(P.year):'[Year]';
  const sub=`Application for ${r} internship`;
  const body=`Dear Hiring Team at ${c},\n\nI am ${n}, a ${yr} ${br} student at ${college}. I am excited about the ${r} opportunity at ${c} and would love to contribute and learn.\n\nI have attached my resume. Highlights: [1 project], [1 skill], [1 achievement].\n\nI would be grateful for a chance to discuss how I can help.\n\nThank you for your time.\nRegards,\n${n}\n[Phone] · [LinkedIn] · [GitHub]`;
  $('emb').value=body;$('mailto').href='mailto:?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
}

  <div class="panel"><h3>🔗 Official links</h3><ul class="clean">${c.links.map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener noreferrer">${esc(l[0])}</a></li>`).join('')}</ul></div></div>
  <section class="sec"><div class="two"><div class="panel"><h3>✅ Master document checklist</h3><ul class="check">${GLOBAL_CHECK.map((d,i)=>`<li><input type="checkbox" id="ck${i}" ${CHECK['g'+i]?'checked':''} onchange="CHECK['g${i}']=this.checked;sSet('sb_check',CHECK)"><label for="ck${i}">${esc(d)}</label></li>`).join('')}</ul></div>
  <div class="panel"><h3>🧳 Survival basics for any country</h3><ul class="clean"><li><b>Money:</b> Use a forex or multi-currency card. Keep emergency cash for the first week.</li><li><b>SIM and data:</b> Buy a local SIM at the airport or switch to an eSIM.</li><li><b>Safety:</b> Save the Indian embassy number and register on the MADAD portal.</li><li><b>Insurance:</b> Keep health insurance papers on your phone.</li><li><b>Housing:</b> Never pay a deposit before seeing the place. Use university housing in the first month.</li><li><b>Food:</b> Cook in batches. Find halal, vegetarian or Indian groceries in advance.</li><li><b>Documents:</b> Keep scans in cloud storage and carry photocopies.</li><li><b>Community:</b> Join Indian student groups for tips, rides and housing leads.</li></ul></div></div></section>`;
}

function pLearn(){
  const L=COURSES[S.lCat];
  return `<div class="page-h fade"><h1>Learn, practise, repeat</h1><p>Free courses like CS50, paid options with certificates, quick notes and a focus timer.</p></div>
  <div class="chips"><button class="chip${S.lCat==='free'?' on':''}" onclick="setS('lCat','free')">Free courses</button><button class="chip${S.lCat==='paid'?' on':''}" onclick="setS('lCat','paid')">Paid courses</button></div>
  <div class="cards">${L.map((c,i)=>`<article class="card">${art(c.e,'learn',i+2,S.lCat==='free'?'Free':'Paid')}<div class="body"><h3>${esc(c.n)}</h3><p>${esc(c.o)}</p><p>${esc(c.d)}</p><div class="acts"><a class="btn sm" href="${c.link}" target="_blank" rel="noopener noreferrer">${S.lCat==='free'?'Start learning':'View and register'}</a></div></div></article>`).join('')}</div>
  <section class="sec"><div class="two"><div class="panel"><h3>🗒️ Quick notes</h3>${NOTES.map(n=>`<details><summary>${esc(n[0])}</summary><pre>${esc(n[1])}</pre></details>`).join('')}<h3 style="margin-top:16px">More note libraries</h3><ul class="clean">${NOTE_LINKS.map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener noreferrer">${esc(l[0])}</a></li>`).join('')}</ul></div>
  <div class="panel" style="text-align:center"><h3>⏰ Focus timer</h3><div class="timer" id="tm">25:00</div><div class="chips" style="justify-content:center"><button class="chip" onclick="pomo(25)">Focus 25</button><button class="chip" onclick="pomo(5)">Break 5</button><button class="chip" onclick="pomo(0)">Reset</button></div><p class="note">Study in short sprints and take breaks.</p></div></div></section>`;
}
let pt=null;
function pomo(m){
  clearInterval(pt);const el=$('tm');if(!el)return;
  if(!m){el.textContent='25:00';return}
  let s=m*60;el.textContent=fmt(s);
  pt=setInterval(()=>{s--;const e=$('tm');if(!e){clearInterval(pt);return}e.textContent=fmt(s);if(s<=0){clearInterval(pt);toast('Time is up!')}},1000);
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function pCerts(){
  const L=CERTS.filter(c=>S.cFree==='all'||(S.cFree==='free')===c.free);
  return `<div class="page-h fade"><h1>Certificates</h1><p>Compare duration, requirements and cost before you commit.</p></div>
  <div class="chips">${[['all','All'],['free','Free'],['paid','Paid']].map(t=>`<button class="chip${S.cFree===t[0]?' on':''}" onclick="setS('cFree','${t[0]}')">${t[1]}</button>`).join('')}</div>
  <div class="cards">${L.map((c,i)=>`<article class="card">${art(c.e,'cert',i+3,c.free?'Free':'Paid')}<div class="body"><h3>${esc(c.n)}</h3><p>${esc(c.o)}</p>
  <div class="scroll-x"><table><tr><th>Duration</th><td>${esc(c.dur)}</td></tr><tr><th>Requirements</th><td>${esc(c.req)}</td></tr><tr><th>Cost</th><td>${esc(c.cost)}</td></tr></table></div>
  <div class="acts"><a class="btn sm" href="${c.link}" target="_blank" rel="noopener noreferrer">Register / details</a></div></div></article>`).join('')}</div>
  <p class="note" style="margin-top:14px">Prices and rules change. Check the provider's page before paying.</p>`;
}

function pPerks(){
  const cats=['all'].concat([...new Set(PERKS.map(p=>p.c))]);
  const L=PERKS.filter(p=>S.pCat==='all'||p.c===S.pCat);
  return `<div class="page-h fade"><h1>Student ID perks and discounts</h1><p>Keep your college ID or email handy. Many of these offers need quick verification.</p></div>
  <div class="chips">${cats.map(c=>`<button class="chip${S.pCat===c?' on':''}" onclick="setS('pCat','${c}')">${c==='all'?'All':c}</button>`).join('')}</div>
  <div class="cards">${L.map((p,i)=>`<article class="card">${art(p.e,'perk',i+4,p.c)}<div class="body"><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p><div class="meta"><i>🪪 ${esc(p.need)}</i></div><div class="acts"><a class="btn sm" href="${p.link}" target="_blank" rel="noopener noreferrer">Claim / learn more</a></div></div></article>`).join('')}</div>`;
}

function pProfile(){
  const p=P||{};
  const saved=SAVED.map(id=>EV.find(e=>e.id===id)).filter(Boolean);
  return `<div class="page-h fade"><h1>${P&&!P.guest?'Your profile':'Log in or sign up'}</h1><p>Your details stay on this device. We use them only to check eligibility.</p></div>
  <div class="two" style="margin-top:18px"><div class="panel"><h3>Your details</h3>
  <div class="qgrid" style="grid-template-columns:1fr 1fr">
  <div><label class="f" for="pn">Full name</label><input id="pn" value="${esc(p.guest?'':p.name)}" placeholder="Your name"></div>
  <div><label class="f" for="pe">Email</label><input id="pe" type="email" value="${esc(p.email)}" placeholder="you@college.edu"></div>
  <div><label class="f" for="pa">Age</label><input id="pa" type="number" min="13" max="40" value="${p.age||''}"></div>
  <div><label class="f" for="pg">Gender</label><select id="pg"><option value="female"${p.gender==='female'?' selected':''}>Female</option><option value="male"${p.gender==='male'?' selected':''}>Male</option><option value="other"${p.gender==='other'?' selected':''}>Other / prefer not to say</option></select></div>
  <div><label class="f" for="py">College year</label><select id="py">${YEARS.map(y=>`<option value="${y[0]}"${p.year===y[0]?' selected':''}>${y[1]}</option>`).join('')}</select></div>
  <div><label class="f" for="pb">Branch</label><select id="pb">${BRANCHES.map(b=>`<option${p.branch===b?' selected':''}>${b}</option>`).join('')}</select></div>
  <div><label class="f" for="pc">College</label><input id="pc" value="${esc(p.college)}" placeholder="Your college"></div>
  <div><label class="f" for="pr">Nearest city</label><select id="pr">${REGIONS.map(r=>`<option${(p.region||'Delhi NCR')===r?' selected':''}>${r}</option>`).join('')}</select></div></div>
  <div class="acts" style="margin-top:14px"><button class="btn" onclick="saveProfile()">Save and continue</button>${P?'<button class="btn ghost" onclick="logout()">Log out</button>':''}</div></div>
  <div class="panel"><h3>⭐ Saved events</h3>${saved.length?`<ul class="clean">${saved.map(e=>`<li><b>${esc(e.n)}</b> · ${pill(check(e))} <a href="${e.link}" target="_blank" rel="noopener noreferrer">site</a></li>`).join('')}</ul>`:'<p class="note">Nothing saved yet. Tap "Save" on any event.</p>'}
  <h3 style="margin-top:18px">Why we ask</h3><p class="note">Age, gender, year and branch are the common rules in hackathons, scholarships and internships. We compare them with each opportunity and show the reason if you do not qualify.</p></div></div>`;
}
function saveProfile(){
  const age=+$('pa').value,name=$('pn').value.trim();
  if(!name){toast('Please enter your name');return}
  if(!age||age<13||age>40){toast('Enter a valid age');return}
  P={name,email:$('pe').value.trim(),age,gender:$('pg').value,year:$('py').value,branch:$('pb').value,college:$('pc').value.trim(),region:$('pr').value};
  sSet('sb_profile',P);updateWho();toast('Profile saved');location.hash='#/events';
}
function logout(){P=null;sSet('sb_profile',null);updateWho();toast('Logged out');rerender()}
function updateWho(){$('who').textContent=P&&!P.guest?'👤 '+P.name.split(' ')[0]:'Log in'}

/* ---------- router ---------- */
const ROUTES={home:['Home',pHome],events:['Events',pEvents],internships:['Internships',pInternships],abroad:['Study abroad',pAbroad],learn:['Learn',pLearn],certs:['Certificates',pCerts],perks:['Perks',pPerks],profile:['Profile',pProfile]};
const MSG={home:'Loading your campus…',events:'Finding events for you…',internships:'Scanning internships near you…',abroad:'Packing your passport…',learn:'Opening the library…',certs:'Fetching certificates…',perks:'Unlocking discounts…',profile:'Opening your profile…'};
let cur='home',first=true;
function routeName(){const h=(location.hash||'#/home').replace('#/','').split('?')[0];return ROUTES[h]?h:'home'}
function render(){
  const [t,fn]=ROUTES[cur];
  clearInterval(pt);
  $('app').innerHTML=fn();
  $('nav').innerHTML=Object.keys(ROUTES).filter(k=>k!=='profile').map(k=>`<a href="#/${k}" class="${k===cur?'act':''}">${ROUTES[k][0]}</a>`).join('');
  document.title=t+' · Student Buddy';
  if(cur==='internships')mail();
}
function rerender(){
  const a=document.activeElement,id=a&&a.id,y=window.scrollY;
  render();window.scrollTo(0,y);
  if(id){const el=$(id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}
let lt=null;
function navigate(){
  cur=routeName();
  const L=$('loader');$('ltxt').textContent=MSG[cur];
  L.classList.remove('on');void L.offsetWidth;L.classList.add('on');
  clearTimeout(lt);
  lt=setTimeout(()=>{render();window.scrollTo(0,0);L.classList.remove('on');
    if(first){first=false;if(!P)setTimeout(welcome,400)}},first?1300:950);
}
function welcome(){
  openModal(`<h2>Welcome to Student Buddy 🎓</h2><p>Add your age, gender, year and branch once. We will show only the events and internships you can actually join.</p><div class="acts"><a class="btn" href="#/profile" onclick="closeModal()">Create profile</a><button class="btn ghost" onclick="closeModal()">Browse as guest</button></div>`);
}
window.addEventListener('hashchange',navigate);
updateWho();navigate();
</script>
</body>
</html>
